name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/LinkManager2/LinkManager2.csproj

      - name: Build
        run: dotnet build src/LinkManager2/LinkManager2.csproj -c Debug --no-restore
